# ──────────────────────────────────────────────────────────────────────────
# Daily Kids Fun Fact Video Generator – GitHub Actions Workflow
#
# Runs every day at 08:00 UTC (13:30 IST).
# Generates a 9:16 short-form video and uploads it to YouTube.
#
# Required GitHub Secrets:
#   GEMINI_API_KEY          – Google AI Studio API key
#   PEXELS_API_KEY          – Pexels API key
#   YOUTUBE_OAUTH_TOKEN     – Contents of token.json (from local OAuth flow)
#   YOUTUBE_CLIENT_SECRETS  – Contents of client_secrets.json
# ──────────────────────────────────────────────────────────────────────────

name: Daily Kids Fun Fact Short

on:
  schedule:
    # Every day at 08:00 UTC (13:30 IST)
    - cron: "0 8 * * *"

  # Allow manual trigger from GitHub UI for testing
  workflow_dispatch:

  # Push trigger keeps the repo "active" so GitHub doesn't disable
  # the scheduled cron for inactivity (repos idle >60 days get disabled)
  push:
    branches:
      - main

# Needed to write back a refreshed token.json if OAuth token auto-refreshes
permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ── 1. Checkout repository ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Python ──
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install system dependencies: ffmpeg, fonts & ImageMagick ──
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation \
            imagemagick

      # ── 4. Install Python dependencies ──
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Restore YouTube OAuth credentials from secrets ──
      - name: Write YouTube credentials
        env:
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: |
          echo "$YOUTUBE_OAUTH_TOKEN" > token.json
          echo "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          echo "Credentials written successfully."

      # ── 6. Validate secrets are present ──
      - name: Validate required secrets
        run: |
          python - <<'EOF'
          import os, sys
          missing = []
          for var in ["GEMINI_API_KEY", "PEXELS_API_KEY"]:
              if not os.environ.get(var):
                  missing.append(var)
          if not os.path.exists("token.json") or os.path.getsize("token.json") < 10:
              missing.append("YOUTUBE_OAUTH_TOKEN (token.json is empty)")
          if not os.path.exists("client_secrets.json") or os.path.getsize("client_secrets.json") < 10:
              missing.append("YOUTUBE_CLIENT_SECRETS (client_secrets.json is empty)")
          if missing:
              print("ERROR: Missing secrets:", missing)
              sys.exit(1)
          print("All required secrets are present.")
          EOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # ── 7. Run the pipeline ──
      - name: Generate & upload video
        run: python main.py

      # ── 8. Upload the rendered video as a build artifact (backup) ──
      - name: Archive rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-kids-fact-video
          path: output/final_video.mp4
          if-no-files-found: warn
          retention-days: 7
